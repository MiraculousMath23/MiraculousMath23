        <main>
            <div>
                <h1>Survey</h1>
                <form>
                    <p>
                        <label for="name_field">What is your name?<abbr title="required" aria-label="required">*</abbr></label>
                        <input type="text" id="name" name="name_field"/> 
                    </p>
                    <p>
                        <label for="email_field">What is your email?<abbr title="required" aria-label="required">*</abbr></label>
                        <input type="text" id="email_field" name="email_field"/> 
                    </p>
                    <p>
                        <label for="best_whole_number">Which whole number is best?</label>
                        <input type="number" id="best_whole_number" name="best_whole_number" min="1"/> 
                    </p>
                    <p>
                        <label for="best_day">Which day is best?</label>
                        <input type="date" id="best_day" name="best_day" list=" ,teddy "/> 
                    </p>
                    <p>
                        <label for="best_bear">Which bear is best?<abbr title="required" aria-label="required">*</abbr></label>
                        <select id="best_bear" name="best_bear" >
                            <option value="">&nbsp;</option>
                            <option>Black</option>
                            <option>Brown</option>
                            <option>Care</option>
                            <option>Panda</option>
                            <option>Polar</option>
                            <option>Teddy</option>
                            <option>Koala</option>
                        </select>
                    </p>
                    <fieldset >
                        <legend>Do you like radio buttons?</legend>
                        <ul>
                            <li>
                                <label for="yes">Yes</label>
                                <input type="radio" value="yes" id="yes" name="enjoys_radio_buttons"/>
                            </li>
                            <li>
                                <label for="no">No</label>
                                <input type="radio" value="no" id="no" name="enjoys_radio_buttons"/>
                            </li>
                            <li>
                                <label for="?">None of your business</label>
                                <input type="radio" value="?" id="?" name="enjoys_radio_buttons" checked/>
                            </li>
                        </ul>
                        
                    </fieldset>
                    <p>
                        <label for="life_meaning">What is the meaning of life?</label>
                        <textarea type="text" id="life_meaning" name="life_meaning" cols="50" rows="5" placeholder="Enter the correct answer here"></textarea> 
                    </p>
                    <button type="submit">Send</button>
                </form>
            </div>
